<div class="container-fluid vh-100 p-5 align-items-center justify-content-center d-flex red bg-primary bg-gradient" id="conta">
    <div class="row border border-dark center h-100 rounded g-0">
        <div class="col-12 col-md-6 d-none d-md-block">
                <img class="card-img-top w-100 h-100 rounded" id="loginimg" src="https://exprofundis.com/wp-content/uploads/2015/09/tumblr_ngzxxaUS4H1tj0qdro7_1280.jpg" alt="Card image cap">
        </div>
        <div class="col-12 col-md-6 p-5 d-flex flex-column justify-content-center bg-light rounded" id="loginform">
            <h2 class="fw-bold text-center">Registrar cuenta</h2>
            @if (errorMessage) {
                <div>
                    <h2 class="fw-bold text-center">{{errorMessage}}</h2>
                </div>
            }
            <form (ngSubmit) = "register()">
                <label for="name" class="form-label fs-3">Nombre</label>
                <input [(ngModel)]="nombre" name="nombre" type="name" class="form-control form-control-lg" id="name" placeholder="Nombre">
                <label for="lastName" class="form-label fs-3 mt-3">Apellido</label>
                <input [(ngModel)]="apellido" name="apellido" class="form-control form-control-lg" id="lastName" placeholder="Apellido">
                <label for="email" class="form-label fs-3 mt-3">Email</label>
                <input [(ngModel)]="email" name="email" type="email" class="form-control form-control-lg" id="email" placeholder="georgiarose@gmail.com">
                <label for="password" class="form-label text-center fs-3 mt-3">Contraseña</label>
                <input [(ngModel)]="password" name="password" type="password" class="form-control form-control-lg" id="password" placeholder="********">
                <label for="confirmPassword" type="password" class="form-label text-center fs-3 mt-3">Repita Contraseña</label>
                <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" class="form-control form-control-lg" id="confirmPassword" placeholder="********">
                <div class="text-center">
                    <button type="submit" [disabled]="isLoading" class="btn btn-primary my-5 center fs-3">
                        @if (isLoading) {
                            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            <span>Procesando...</span>
                          } @else {
                            <span>Registrarse</span>
                          }
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
