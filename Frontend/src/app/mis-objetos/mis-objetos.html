<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Mis objetos</h2>
    <a routerLink="/objeto-form" class="btn btn-primary">
      + Publicar objeto
    </a>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let objeto of objetos">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ objeto.titulo }}</h5>
          <p class="card-text">{{ objeto.descripcion }}</p>
          <span class="badge" 
            [ngClass]="objeto.estado === 'disponible' ? 'bg-success' : 'bg-warning'">
            {{ objeto.estado }}
          </span>
          <div class="mt-3 d-flex gap-2">
            <a [routerLink]="['/objeto-form', objeto._id]" class="btn btn-sm btn-secondary">
              Editar
            </a>
            <button class="btn btn-sm btn-danger" (click)="eliminarObjeto(objeto._id!)">
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p *ngIf="objetos.length === 0">No tenés objetos publicados todavía.</p>
</div>
